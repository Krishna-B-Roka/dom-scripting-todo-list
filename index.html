<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - To-Do List</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container">

        <h1>TaskFlow</h1>
        <p>Organize your tasks easily</p>

        <form id="taskForm">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a task"
            >

            <button type="submit">Add Task</button>

            <p id="errorMessage"></p>

        </form>

        <h2>My Tasks</h2>

        <ul id="taskList"></ul>

    </div>

    <script src="js/script.js"></script>

</body>
</html>
